<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d97706">
<title>BTP-Connect | Cameroun</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--amber:#d97706;--amber-l:#f59e0b;--navy:#111827;--gray:#6b7280;--line:#d1d5db;--bg:#f8fafc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-text-size-adjust:100%;padding-bottom:88px}
  header{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 #e5e7eb}
  .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:-.5px}
  .logo i{width:38px;height:38px;background:var(--amber);border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:20px}
  .logo b{color:var(--amber)}
  select{font:inherit;font-weight:700;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#f9fafb;color:var(--navy)}
  .hero{background:linear-gradient(110deg,#111827 0%,#1f2937 60%,#451a03 100%);padding:36px 20px 40px;text-align:center;color:#fff}
  .badge{display:inline-block;border:1px solid rgba(245,158,11,.5);background:rgba(245,158,11,.15);color:var(--amber-l);font-weight:800;font-size:11px;letter-spacing:1px;padding:7px 14px;border-radius:999px;text-transform:uppercase}
  .hero h2{font-size:28px;line-height:1.2;font-weight:800;margin:16px 0 12px}
  .hero h2 .acc{color:var(--amber-l)}
  .hero p{color:#d1d5db;font-size:14px;line-height:1.5}
  main{max-width:520px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06);margin-bottom:16px}
  .card.admin-card{border-left:4px solid #111827;background:#fdfdfd}
  .tabs{display:flex;border-bottom:2px solid #e5e7eb;margin-bottom:20px}
  .tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 0;font:inherit;font-weight:700;font-size:17px;color:#9ca3af;cursor:pointer}
  .tabs button.active{color:var(--amber);border-bottom-color:var(--amber)}
  h3{font-size:19px;font-weight:800;margin-bottom:14px}
  input,.card select,textarea{display:block;width:100%;font:inherit;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);border-color:var(--amber)}
  .pwd{position:relative;margin-bottom:12px}
  .pwd input{margin-bottom:0;padding-right:52px}
  .pwd .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;background:none;border:0;font-size:20px;cursor:pointer}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--amber);cursor:pointer;text-align:center;text-decoration:none;display:block}
  .btn:disabled{opacity:.6}
  .btn.red{background:#fee2e2;color:#dc2626}
  .btn.gray{background:#e5e7eb;color:#374151}
  .btn.chat-btn{background:#2563eb;color:#fff;padding:10px;font-size:14px;margin-top:8px}
  .btn.wa{background:#16a34a;padding:10px;font-size:14px;margin-top:8px}
  .btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:13px}
  .hidden{display:none!important}
  #toast{position:fixed;left:12px;right:12px;bottom:92px;max-width:496px;margin:0 auto;z-index:30;font-size:14px;font-weight:600;padding:12px 16px;border-radius:12px;background:#111827;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #toast.err{background:#b91c1c}
  #toast.ok{background:#047857}
  .welcome{color:#059669;font-weight:800;font-size:17px}
  .role{color:var(--gray);font-size:13px;margin:2px 0 6px}
  .chip{display:inline-block;background:#f3f4f6;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;margin:8px 6px 0 0}
  .ad{background:#fff;border:1px solid #e5e7eb;border-left:4px solid var(--amber);border-radius:14px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.5}
  .ad.closed{opacity:.65}
  .ad h4{font-size:16px;font-weight:800}
  .ad .p{color:#059669;font-weight:800;font-size:16px;margin-top:4px}
  .ad .m{color:var(--gray);font-size:12px;margin-top:2px}
  .ad img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:#f3f4f6;display:block}
  .kb{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;margin-bottom:8px}
  .kb.req{background:#dbeafe;color:#1d4ed8}
  .kb.off{background:#fef3c7;color:#92400e}
  .kb.cl{background:#e5e7eb;color:#374151;margin-left:6px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ib{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
  .ib.on{color:#dc2626;border-color:#fecaca;background:#fef2f2}
  .ib.danger{color:#dc2626}
  .stars{color:var(--amber-l);letter-spacing:1px}
  .starpick{margin:6px 0}
  .starpick button{background:none;border:0;font-size:32px;color:#d1d5db;cursor:pointer;padding:0 4px}
  .starpick button.on{color:var(--amber-l)}
  .review{border-top:1px solid #e5e7eb;padding:12px 0;font-size:14px;line-height:1.5}
  .seg{display:flex;background:#e5e7eb;border-radius:12px;padding:4px;margin-bottom:12px;gap:2px}
  .seg button{flex:1;border:0;background:none;padding:9px 2px;border-radius:999px;font:inherit;font-weight:700;font-size:13px;color:var(--gray);cursor:pointer}
  .seg button.active{background:#fff;color:var(--amber);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .filters select,.filters input{margin-bottom:0;padding:11px;font-size:15px}
  .fbar{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;font-size:13px;color:var(--gray)}
  .lnk{background:none;border:0;color:var(--amber);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
  .tag{display:inline-block;background:#fffbeb;color:#92400e;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:6px 6px 0 0}
  .av{width:54px;height:54px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
  .prow{display:flex;gap:12px;align-items:center}
  .bio{margin-top:10px;white-space:pre-wrap}
  .sub{font-size:15px;font-weight:800;margin:18px 0 10px}
  .photo-pick{display:block;border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--gray);font-weight:700;font-size:14px;margin-bottom:12px;cursor:pointer}
  .photo-pick img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:10px;display:block}
  .photo-pick input{display:none}
  .empty{text-align:center;color:var(--gray);padding:24px 8px;font-size:14px}
  .small{font-size:13px;text-align:center;margin-top:14px}
  
  /* CSS Chat & Messagerie */
  .conv-item{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:10px;cursor:pointer}
  .conv-item:hover{background:#f9fafb}
  .chat-box{display:flex;flex-direction:column;height:calc(100vh - 220px);max-height:550px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden}
  .chat-header{padding:12px 16px;background:#f8fafc;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
  .chat-messages{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .msg-bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word}
  .msg-bubble.me{align-self:flex-end;background:var(--amber);color:#fff;border-bottom-right-radius:4px}
  .msg-bubble.them{align-self:flex-start;background:#f3f4f6;color:var(--navy);border-bottom-left-radius:4px}
  .msg-time{font-size:10px;opacity:.75;margin-top:4px;text-align:right}
  .chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid #e5e7eb;background:#fff}
  .chat-input input{margin-bottom:0;flex:1}
  .chat-input button{width:auto;padding:0 18px}

  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
  nav button{flex:1;background:none;border:0;font:inherit;font-size:11px;font-weight:700;color:#9ca3af;padding:6px 0;cursor:pointer;position:relative}
  nav button span{display:block;font-size:21px}
  nav button.active{color:var(--amber)}
  nav .badge-cnt{position:absolute;top:2px;right:25%;background:#dc2626;color:#fff;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:800}
  footer{text-align:center;font-size:11px;color:#9ca3af;padding:6px 0 0}
</style>
</head>
<body>

<header>
  <div class="logo"><i>👷</i><span>BTP-<b>Connect</b></span></div>
  <select id="lang"><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option></select>
</header>

<section class="hero" id="hero">
  <span class="badge" data-i18n="badge"></span>
  <h2><span data-i18n="h1a"></span> <span class="acc" data-i18n="h1b"></span></h2>
  <p data-i18n="sub"></p>
</section>

<main>
  <!-- ========== ANNONCES ========== -->
  <section id="view-listings">
    <div class="seg" id="seg">
      <button type="button" data-kind="all" class="active" data-i18n="kAll"></button>
      <button type="button" data-kind="offer" data-i18n="kOffer"></button>
      <button type="button" data-kind="request" data-i18n="kReq"></button>
    </div>
    <input id="q" type="search" data-ph="search">
    <div class="filters">
      <select id="f-cat"></select>
      <select id="f-city"></select>
      <input id="f-price" type="number" inputmode="numeric" min="0" data-ph="maxPrice">
      <select id="f-sort">
        <option value="recent" data-i18n="sRecent"></option>
        <option value="asc" data-i18n="sAsc"></option>
        <option value="desc" data-i18n="sDesc"></option>
      </select>
    </div>
    <div class="fbar"><span id="count">
