<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d97706">
<title>BTP-Connect | Cameroun</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--amber:#d97706;--amber-l:#f59e0b;--navy:#111827;--gray:#6b7280;--line:#d1d5db;--bg:#f8fafc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-text-size-adjust:100%;padding-bottom:88px}
  header{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 #e5e7eb}
  .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:-.5px}
  .logo i{width:38px;height:38px;background:var(--amber);border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:20px}
  .logo b{color:var(--amber)}
  select{font:inherit;font-weight:700;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#f9fafb;color:var(--navy)}
  .hero{background:linear-gradient(110deg,#111827 0%,#1f2937 60%,#451a03 100%);padding:36px 20px 40px;text-align:center;color:#fff}
  .badge{display:inline-block;border:1px solid rgba(245,158,11,.5);background:rgba(245,158,11,.15);color:var(--amber-l);font-weight:800;font-size:11px;letter-spacing:1px;padding:7px 14px;border-radius:999px;text-transform:uppercase}
  .hero h2{font-size:28px;line-height:1.2;font-weight:800;margin:16px 0 12px}
  .hero h2 .acc{color:var(--amber-l)}
  .hero p{color:#d1d5db;font-size:14px;line-height:1.5}
  main{max-width:520px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06);margin-bottom:16px}
  .card.admin-card{border-left:4px solid #111827;background:#fdfdfd}
  .tabs{display:flex;border-bottom:2px solid #e5e7eb;margin-bottom:20px}
  .tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 0;font:inherit;font-weight:700;font-size:17px;color:#9ca3af;cursor:pointer}
  .tabs button.active{color:var(--amber);border-bottom-color:var(--amber)}
  h3{font-size:19px;font-weight:800;margin-bottom:14px}
  input,.card select,textarea{display:block;width:100%;font:inherit;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);border-color:var(--amber)}
  .pwd{position:relative;margin-bottom:12px}
  .pwd input{margin-bottom:0;padding-right:52px}
  .pwd .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;background:none;border:0;font-size:20px;cursor:pointer}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--amber);cursor:pointer;text-align:center;text-decoration:none;display:block}
  .btn:disabled{opacity:.6}
  .btn.red{background:#fee2e2;color:#dc2626}
  .btn.gray{background:#e5e7eb;color:#374151}
  .btn.chat-btn{background:#2563eb;color:#fff;padding:10px;font-size:14px;margin-top:8px}
  .btn.wa{background:#16a34a;padding:10px;font-size:14px;margin-top:8px}
  .btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:13px}
  .hidden{display:none!important}
  #toast{position:fixed;left:12px;right:12px;bottom:92px;max-width:496px;margin:0 auto;z-index:30;font-size:14px;font-weight:600;padding:12px 16px;border-radius:12px;background:#111827;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #toast.err{background:#b91c1c}
  #toast.ok{background:#047857}
  .welcome{color:#059669;font-weight:800;font-size:17px}
  .role{color:var(--gray);font-size:13px;margin:2px 0 6px}
  .chip{display:inline-block;background:#f3f4f6;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;margin:8px 6px 0 0}
  .ad{background:#fff;border:1px solid #e5e7eb;border-left:4px solid var(--amber);border-radius:14px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.5}
  .ad.closed{opacity:.65}
  .ad h4{font-size:16px;font-weight:800}
  .ad .p{color:#059669;font-weight:800;font-size:16px;margin-top:4px}
  .ad .m{color:var(--gray);font-size:12px;margin-top:2px}
  .ad img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:#f3f4f6;display:block}
  .kb{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;margin-bottom:8px}
  .kb.req{background:#dbeafe;color:#1d4ed8}
  .kb.off{background:#fef3c7;color:#92400e}
  .kb.cl{background:#e5e7eb;color:#374151;margin-left:6px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ib{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
  .ib.on{color:#dc2626;border-color:#fecaca;background:#fef2f2}
  .ib.danger{color:#dc2626}
  .stars{color:var(--amber-l);letter-spacing:1px}
  .starpick{margin:6px 0}
  .starpick button{background:none;border:0;font-size:32px;color:#d1d5db;cursor:pointer;padding:0 4px}
  .starpick button.on{color:var(--amber-l)}
  .review{border-top:1px solid #e5e7eb;padding:12px 0;font-size:14px;line-height:1.5}
  .seg{display:flex;background:#e5e7eb;border-radius:12px;padding:4px;margin-bottom:12px;gap:2px}
  .seg button{flex:1;border:0;background:none;padding:9px 2px;border-radius:999px;font:inherit;font-weight:700;font-size:13px;color:var(--gray);cursor:pointer}
  .seg button.active{background:#fff;color:var(--amber);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .filters select,.filters input{margin-bottom:0;padding:11px;font-size:15px}
  .fbar{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;font-size:13px;color:var(--gray)}
  .lnk{background:none;border:0;color:var(--amber);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
  .tag{display:inline-block;background:#fffbeb;color:#92400e;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:6px 6px 0 0}
  .av{width:54px;height:54px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
  .prow{display:flex;gap:12px;align-items:center}
  .bio{margin-top:10px;white-space:pre-wrap}
  .sub{font-size:15px;font-weight:800;margin:18px 0 10px}
  .photo-pick{display:block;border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--gray);font-weight:700;font-size:14px;margin-bottom:12px;cursor:pointer}
  .photo-pick img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:10px;display:block}
  .photo-pick input{display:none}
  .empty{text-align:center;color:var(--gray);padding:24px 8px;font-size:14px}
  .small{font-size:13px;text-align:center;margin-top:14px}
  
  /* CSS Chat & Messagerie */
  .conv-item{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:10px;cursor:pointer}
  .conv-item:hover{background:#f9fafb}
  .chat-box{display:flex;flex-direction:column;height:calc(100vh - 220px);max-height:550px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden}
  .chat-header{padding:12px 16px;background:#f8fafc;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
  .chat-messages{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .msg-bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word}
  .msg-bubble.me{align-self:flex-end;background:var(--amber);color:#fff;border-bottom-right-radius:4px}
  .msg-bubble.them{align-self:flex-start;background:#f3f4f6;color:var(--navy);border-bottom-left-radius:4px}
  .msg-time{font-size:10px;opacity:.75;margin-top:4px;text-align:right}
  .chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid #e5e7eb;background:#fff}
  .chat-input input{margin-bottom:0;flex:1}
  .chat-input button{width:auto;padding:0 18px}

  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
  nav button{flex:1;background:none;border:0;font:inherit;font-size:11px;font-weight:700;color:#9ca3af;padding:6px 0;cursor:pointer;position:relative}
  nav button span{display:block;font-size:21px}
  nav button.active{color:var(--amber)}
  nav .badge-cnt{position:absolute;top:2px;right:25%;background:#dc2626;color:#fff;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:800}
  footer{text-align:center;font-size:11px;color:#9ca3af;padding:6px 0 0}
</style>
</head>
<body>

<header>
  <div class="logo"><i>👷</i><span>BTP-<b>Connect</b></span></div>
  <select id="lang"><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option></select>
</header>

<section class="hero" id="hero">
  <span class="badge" data-i18n="badge"></span>
  <h2><span data-i18n="h1a"></span> <span class="acc" data-i18n="h1b"></span></h2>
  <p data-i18n="sub"></p>
</section>

<main>
  <!-- ========== ANNONCES ========== -->
  <section id="view-listings">
    <div class="seg" id="seg">
      <button type="button" data-kind="all" class="active" data-i18n="kAll"></button>
      <button type="button" data-kind="offer" data-i18n="kOffer"></button>
      <button type="button" data-kind="request" data-i18n="kReq"></button>
    </div>
    <input id="q" type="search" data-ph="search">
    <div class="filters">
      <select id="f-cat"></select>
      <select id="f-city"></select>
      <input id="f-price" type="number" inputmode="numeric" min="0" data-ph="maxPrice">
      <select id="f-sort">
        <option value="recent" data-i18n="sRecent"></option>
        <option value="asc" data-i18n="sAsc"></option>
        <option value="desc" data-i18n="sDesc"></option>
      </select>
    </div>
    <div class="fbar"><span id="count"></span><button type="button" class="lnk" id="f-reset" data-i18n="reset"></button></div>
    <div id="listings"></div>
    <button type="button" class="btn gray hidden" id="more" data-i18n="more"></button>
  </section>

  <!-- ========== PROS ========== -->
  <section id="view-pros" class="hidden">
    <input id="pq" type="search" data-ph="proSearch">
    <div id="pros"></div>
  </section>

  <!-- ========== CHAT & MESSAGERIE ========== -->
  <section id="view-messages" class="hidden">
    <div id="msg-locked" class="card hidden">
      <p class="empty" data-i18n="needLogin"></p>
      <button type="button" class="btn" id="go-account-msg" data-i18n="goLogin"></button>
    </div>
    <div id="msg-content" class="hidden">
      <!-- Liste des conversations -->
      <div id="conv-list-box">
        <h3>💬 Messages</h3>
        <div id="conversations-list"></div>
      </div>
      <!-- Fenêtre de chat active -->
      <div id="chat-window-box" class="hidden">
        <button type="button" class="btn gray" id="back-convs" style="margin-bottom:10px">← Retour aux conversations</button>
        <div class="chat-box">
          <div class="chat-header">
            <strong id="chat-target-name">...</strong>
            <span id="chat-target-role" class="m"></span>
          </div>
          <div class="chat-messages" id="chat-messages"></div>
          <form class="chat-input" id="chat-form">
            <input id="chat-text" type="text" placeholder="Écrivez un message..." autocomplete="off">
            <button class="btn" type="submit">Envoyer</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== PROFIL PUBLIC ========== -->
  <section id="view-profile" class="hidden">
    <button type="button" class="btn gray" style="margin-bottom:12px" id="back-pros" data-i18n="back"></button>
    <div id="profile-box" class="card"></div>
  </section>

  <!-- ========== PUBLIER / MODIFIER ========== -->
  <section id="view-publish" class="hidden">
    <div id="pub-locked" class="card hidden">
      <p class="empty" data-i18n="needLogin"></p>
      <button type="button" class="btn" id="go-account" data-i18n="goLogin"></button>
    </div>
    <div id="pub-form-card" class="card hidden">
      <h3 id="pub-title"></h3>
      <form id="form-listing" novalidate>
        <select id="li-kind">
          <option value="offer" data-i18n="kindOffer"></option>
          <option value="request" data-i18n="kindReq"></option>
        </select>
        <input id="li-title" type="text" data-ph="pTitle">
        <textarea id="li-desc" rows="4" data-ph="pDesc"></textarea>
        <select id="li-cat"></select>
        <input id="li-price" type="number" inputmode="numeric" min="0" data-ph="pPrice">
        <input id="li-city" type="text" value="Douala" data-ph="pCity">
        <label class="photo-pick">
          <span id="photo-text"></span>
          <input id="li-photo" type="file" accept="image/*">
          <img id="photo-preview" class="hidden" alt="">
        </label>
        <button class="btn" type="submit" id="pub-btn"></button>
        <button type="button" class="btn gray hidden" style="margin-top:10px" id="pub-cancel" data-i18n="cancel"></button>
      </form>
    </div>
  </section>

  <!-- ========== COMPTE ========== -->
  <section id="view-account" class="hidden">
    <div id="auth" class="card hidden">
      <div class="tabs">
        <button type="button" id="tab-login" class="active" data-i18n="tabLogin"></button>
        <button type="button" id="tab-signup" data-i18n="tabSignup"></button>
      </div>
      <form id="form-login" novalidate>
        <h3 data-i18n="loginTitle"></h3>
        <input id="lo-email" type="email" autocomplete="email" data-ph="email">
        <div class="pwd">
          <input id="lo-pass" type="password" autocomplete="current-password" data-ph="pass">
          <button type="button" class="eye" data-target="lo-pass" aria-label="Afficher / masquer">👁️</button>
        </div>
        <button class="btn" type="submit" data-i18n="loginBtn"></button>
        <p class="small"><button type="button" class="lnk" id="forgot" data-i18n="forgot"></button></p>
      </form>
      <form id="form-signup" class="hidden" novalidate>
        <h3 data-i18n="signupTitle"></h3>
        <input id="su-name" type="text" autocomplete="name" data-ph="name">
        <input id="su-email" type="email" autocomplete="email" data-ph="email">
        <input id="su-phone" type="tel" autocomplete="tel" data-ph="phone">
        <select id="su-type">
          <option value="client" data-i18n="tClient"></option>
          <option value="artisan" data-i18n="tArtisan"></option>
          <option value="entreprise" data-i18n="tCompany"></option>
        </select>
        <div class="pwd">
          <input id="su-pass" type="password" autocomplete="new-password" data-ph="pass6">
          <button type="button" class="eye" data-target="su-pass" aria-label="Afficher / masquer">👁️</button>
        </div>
        <div class="pwd">
          <input id="su-pass2" type="password" autocomplete="new-password" data-ph="pass2">
          <button type="button" class="eye" data-target="su-pass2" aria-label="Afficher / masquer">👁️</button>
        </div>
        <button class="btn" type="submit" data-i18n="signupBtn"></button>
      </form>
    </div>

    <div id="recover" class="card hidden">
      <form id="form-recover" novalidate>
        <h3 data-i18n="recTitle"></h3>
        <div class="pwd">
          <input id="rc-pass" type="password" autocomplete="new-password" data-ph="newPass">
          <button type="button" class="eye" data-target="rc-pass" aria-label="Afficher / masquer">👁️</button>
        </div>
        <button class="btn" type="submit" data-i18n="recBtn"></button>
      </form>
    </div>

    <div id="panel" class="hidden">
      <div class="card">
        <p id="welcome" class="welcome"></p>
        <p id="role" class="role"></p>
        <div id="stats"></div>
      </div>
      
      <div class="seg" id="subseg">
        <button type="button" data-sub="admin" id="sub-admin-btn" class="hidden" data-i18n="subAdmin"></button>
        <button type="button" data-sub="profile" id="sub-profile-btn" class="active" data-i18n="subProfile"></button>
        <button type="button" data-sub="mine" id="sub-mine-btn" data-i18n="subMine"></button>
        <button type="button" data-sub="favs" id="sub-favs-btn" data-i18n="subFavs"></button>
      </div>

      <div id="sub-profile" class="card">
        <form id="form-profile" novalidate>
          <input id="pf-city" type="text" data-ph="pCity">
          <select id="pf-spec"></select>
          <textarea id="pf-bio" rows="4" data-ph="bioPh"></textarea>
          <button class="btn" type="submit" data-i18n="saveProfile"></button>
        </form>
      </div>
      <div id="sub-mine" class="hidden"></div>
      <div id="sub-favs" class="hidden"></div>
      <div id="sub-admin" class="hidden"></div>

      <button type="button" id="logout" class="btn red" style="margin-top:16px" data-i18n="logout"></button>
    </div>
  </section>

  <footer>BTP-Connect · v12</footer>
</main>

<div id="toast" class="hidden"></div>

<nav>
  <button type="button" data-view="listings" class="active"><span>📢</span><b data-i18n="navAds"></b></button>
  <button type="button" data-view="pros"><span>👷</span><b data-i18n="navPros"></b></button>
  <button type="button" data-view="messages"><span>💬</span><b>Chat</b><span id="unread-badge" class="badge-cnt hidden">0</span></button>
  <button type="button" data-view="publish"><span>➕</span><b data-i18n="navPub"></b></button>
  <button type="button" data-view="account"><span>👤</span><b data-i18n="navAcc"></b></button>
</nav>

  /* =============================== MESSAGERIE / CHAT EN DIRECT =============================== */
  async function startConversation(targetUserId, listingId = null) {
    if (!currentUser) { status(t("needLogin"), "err"); return showView("account"); }
    if (same(currentUser.id, targetUserId)) return status("Vous ne pouvez pas discuter avec vous-même", "err");

    const { data: existing } = await sb.from("conversations")
      .select("*")
      .or(`and(participant_a.eq.${currentUser.id},participant_b.eq.${targetUserId}),and(participant_a.eq.${targetUserId},participant_b.eq.${currentUser.id})`);

    let conv = existing && existing[0];

    if (!conv) {
      const { data: newConv, error } = await sb.from("conversations").insert([{
        participant_a: currentUser.id,
        participant_b: targetUserId,
        listing_id: listingId ? Number(listingId) : null
      }]).select().single();

      if (error) return status("Erreur lors de la création de la discussion : " + error.message, "err");
      conv = newConv;
    }

    showView("messages");
    openChat(conv);
  }

  async function loadConversations() {
    if (!sb || !currentUser) return;
    const { data, error } = await sb.from("conversations")
      .select("*")
      .or(`participant_a.eq.${currentUser.id},participant_b.eq.${currentUser.id}`)
      .order("updated_at", { ascending: false });

    if (error) return console.warn("convs err:", error.message);
    conversations = data || [];
    renderConversationsList();
  }

  function renderConversationsList() {
    const box = $("conversations-list");
    if (!box) return;
    if (!conversations.length) {
      box.innerHTML = '<p class="empty">Aucune discussion en cours.</p>';
      return;
    }

    box.innerHTML = conversations.map(c => {
      const otherId = same(c.participant_a, currentUser.id) ? c.participant_b : c.participant_a;
      const otherProf = profiles[otherId] || { full_name: "Utilisateur" };
      return `<div class="conv-item" data-act="openconv" data-id="${c.id}">
        <div class="av">${esc(otherProf.full_name.charAt(0).toUpperCase())}</div>
        <div style="flex:1">
          <strong>${esc(otherProf.full_name)}</strong>
          <div class="m">${esc(T[lang].roles[otherProf.user_type] || "")}</div>
        </div>
        <div class="lnk" style="font-size:12px">Ouvrir →</div>
      </div>`;
    }).join("");
  }

  async function openChat(conv) {
    activeConv = conv;
    if ($("conv-list-box")) $("conv-list-box").classList.add("hidden");
    if ($("chat-window-box")) $("chat-window-box").classList.remove("hidden");

    const otherId = same(conv.participant_a, currentUser.id) ? conv.participant_b : conv.participant_a;
    const otherProf = profiles[otherId] || { full_name: "Utilisateur" };
    if ($("chat-target-name")) $("chat-target-name").textContent = otherProf.full_name;
    if ($("chat-target-role")) $("chat-target-role").textContent = T[lang].roles[otherProf.user_type] || "";

    await loadMessages();
    subscribeToMessages();
  }

  if ($("back-convs")) {
    $("back-convs").addEventListener("click", () => {
      if ($("chat-window-box")) $("chat-window-box").classList.add("hidden");
      if ($("conv-list-box")) $("conv-list-box").classList.remove("hidden");
      if (realTimeSub) sb.removeChannel(realTimeSub);
      activeConv = null;
      loadConversations();
    });
  }

  async function loadMessages() {
    if (!activeConv) return;
    const { data, error } = await sb.from("messages")
      .select("*")
      .eq("conversation_id", activeConv.id)
      .order("created_at", { ascending: true });

    if (error) return status("Erreur messages: " + error.message, "err");
    renderMessages(data || []);
  }

  function renderMessages(msgs) {
    const box = $("chat-messages");
    if (!box) return;
    box.innerHTML = msgs.map(m => {
      const isMe = same(m.sender_id, currentUser.id);
      return `<div class="msg-bubble ${isMe ? 'me' : 'them'}">
        ${esc(m.content)}
        <div class="msg-time">${timeStr(m.created_at)}</div>
      </div>`;
    }).join("");
    box.scrollTop = box.scrollHeight;
  }

  function subscribeToMessages() {
    if (realTimeSub) sb.removeChannel(realTimeSub);
    realTimeSub = sb.channel('chat-messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${activeConv.id}` }, payload => {
        loadMessages();
      })
      .subscribe();
  }

  if ($("chat-form")) {
    $("chat-form").addEventListener("submit", async (e) => {

      const { error } = await sb.from("messages").insert([{
        conversation_id: activeConv.id,
        sender_id: currentUser.id,
        content: text
      }]);

      if (error) status("Erreur lors de l'envoi : " + error.message, "err");
      else loadMessages();
    });
  }

  /* =============================== AUTHENTIFICATION =============================== */

    const m = user.user_metadata || {};
    if (!m.full_name) return;
    const r = await sb.from("profiles").select("id").eq("id", user.id).maybeSingle();
    if (r.data) return;
    const ins = await sb.from("profiles").insert([{ id: user.id, full_name: m.full_name, phone: m.phone, user_type: m.user_type }]);

  /* =============================== CHARGEMENT DES DONNÉES =============================== */
  async function loadAll() {
    if (!sb) return;
    const jobs = [
      sb.from("profiles").select("*"),
      sb.from("listings").select("*").order("created_at", { ascending: false }),
      sb.from("reviews").select("*").order("created_at", { ascending: false })
    ];
    if (currentUser) jobs.push(sb.from("favorites").select("listing_id").eq("user_id", currentUser.id));
    if (isAdmin) jobs.push(sb.from("reports").select("*").order("created_at", { ascending: false }));
    const res = await Promise.all(jobs);

    profiles = {};
    if (!res[0].error) (res[0].data || []).forEach((p) => { profiles[p.id] = p; }); else console.warn("profiles:", res[0].error.message);
    if (res[1].error) { if ($("listings")) $("listings").innerHTML = '<p class="empty" style="color:#dc2626">' + esc(t("errAds") + res[1].error.message) + "</p>"; allListings = []; }
    else allListings = res[1].data || [];
    reviews = res[2].error ? [] : (res[2].data || []);
    if (res[2].error) console.warn("reviews:", res[2].error.message);
    computeRatings();
    let k = 3;
    favs = {};

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => b ? resolve(b) : reject(new Error("Image illisible")), "image/jpeg", 0.8);
      };
      img.onerror = () => reject(new Error("Image illisible"));
      img.src = url;
    });
  }

      if ($("photo-text")) $("photo-text").textContent = t("changePhoto");
    });
  }

  async function writeRow(op, row) {
    let r = await op(row), tries = 0;
    while (r.error && tries++ < 4) {
      const m = /'(\w+)' column/.exec(r.error.message) || /column "?(\w+)"?/.exec(r.error.message);
      if (!m || ["phone", "image_url", "kind"].indexOf(m[1]) < 0 || !(m[1] in row)) break;
      if (m[1] === "kind" && row.kind === "request") return { error: { message: t("needSql") + r.error.message } };
      delete row[m[1]]; r = await op(row);
    }
    return r;
  }

      const title = $("li-title").value.trim(), desc = $("li-desc").value.trim(), cat = $("li-cat").value,
            pr = parseFloat($("li-price").value), city = $("li-city").value.trim(), kind = $("li-kind").value;
      if (!title || !desc || !cat || isNaN(pr) || !city) return status(t("fill"), "err");

      const btn = $("pub-btn"); if (btn) btn.disabled = true;
      let imageUrl = null;
      const file = $("li-photo") ? $("li-photo").files[0] : null;
      if (file) {
        status(t("uploading"));
        try {
          const blob = await compressImage(file), path = currentUser.id + "/" + Date.now() + ".jpg";
          const up = await sb.storage.from("listing-images").upload(path, blob, { contentType: "image/jpeg" });
          if (up.error) throw up.error;
          imageUrl = sb.storage.from("listing-images").getPublicUrl(path).data.publicUrl;
        } catch (err) { if (btn) btn.disabled = false; return status(t("imgErr") + (err.message || err), "err"); }
      }
      status(t("publishing"));
      let r;
      if (editingId) {
        const old = allListings.filter((x) => same(x.id, editingId))[0];
        const row = { kind, title, description: desc, category: cat, price: pr, city };
        if (imageUrl) row.image_url = imageUrl;
        r = await writeRow((x) => sb.from("listings").update(x).eq("id", editingId), row);
        if (!r.error && imageUrl && old && old.image_url) removeImage(old.image_url);
      } else {
        const row = { kind, image_url: imageUrl, title, description: desc, category: cat, price: pr, city,
                      provider_id: currentUser.id, phone: (currentUser.user_metadata || {}).phone || null };
        r = await writeRow((x) => sb.from("listings").insert([x]), row);
      }
      if (btn) btn.disabled = false;
      if (r.error) return status("Erreur : " + r.error.message, "err");
      status(t(editingId ? "editOk" : "pubOk"), "ok");
      const wasEdit = !!editingId;
      resetForm();
      await reload();
      if (wasEdit) { showView("account"); showSub("mine"); } else showView("listings");
    });
  }

  function startEdit(id) {
    const i = allListings.filter((x) => same(x.id, id))[0];
    if (!i) return;
    editingId = i.id;
    if ($("li-kind")) $("li-kind").value = i.kind || "offer";
    if ($("li-title")) $("li-title").value = i.title || "";
    if ($("li-desc")) $("li-desc").value = i.description || "";
    if (i.category && CATS.indexOf(i.category) < 0 && $("li-cat")) $("li-cat").insertAdjacentHTML("beforeend", "<option>" + esc(i.category) + "</option>");
    if ($("li-cat")) $("li-cat").value = i.category || "";
    if ($("li-price")) $("li-price").value = i.price;
    if ($("li-city")) $("li-city").value = i.city || "";
    if ($("li-photo")) $("li-photo").value = "";
    if (i.image_url) {
      if ($("photo-preview")) { $("photo-preview").src = i.image_url; $("photo-preview").classList.remove("hidden"); }
      if ($("photo-text")) $("photo-text").textContent = t("changePhoto");
    } else resetPhoto();
    updatePublishTexts(); showView("publish");
  }

  /* =============================== ACTIONS =============================== */
  async function toggleFav(id) {
    if (!currentUser) { status(t("needLogin"), "err"); return showView("account"); }
    id = String(id);
    if (favs[id]) {
      const r = await sb.from("favorites").delete().eq("user_id", currentUser.id).eq("listing_id", id);
      if (r.error) return status(r.error.message, "err");
      delete favs[id];
    } else {
      const r = await sb.from("favorites").insert([{ user_id: currentUser.id, listing_id: id }]);
      if (r.error) return status(r.error.message, "err");
      favs[id] = true;
    }
    renderAll();
  }

  async function shareListing(id) {
    const i = allListings.filter((x) => same(x.id, id))[0];
    if (!i) return;
    const text = i.title + " — " + price(i.price) + " FCFA" + (i.city ? " (" + i.city + ")" : "") + " · BTP-Connect";
    const url = location.origin + location.pathname;
    if (navigator.share) { try { await navigator.share({ title: i.title, text, url }); } catch (e) {} return; }
    window.open("https://wa.me/?text=" + encodeURIComponent(text + " " + url), "_blank");
  }

  async function reportListing(id) {
    if (!currentUser) { status(t("needLogin"), "err"); return showView("account"); }
    const reason = prompt(t("reportAsk"));
    if (reason === null) return;
    const r = await sb.from("reports").insert([{ listing_id: String(id), reporter_id: currentUser.id, reason: reason.trim() }]);
    if (r.error) return status(/duplicate|unique/i.test(r.error.message) ? t("alreadyReported") : r.error.message, "err");
    status(t("reported"), "ok");
  }

  async function sendReview(proId) {
    if (!reviewStars) return status(t("pickStars"), "err");
    const commentInput = $("rv-text");
    const row = { pro_id: proId, author_id: currentUser.id, rating: reviewStars, comment: commentInput ? commentInput.value.trim() : "" };
    const r = await sb.from("reviews").upsert([row], { onConflict: "pro_id,author_id" });
    if (r.error) return status(r.error.message, "err");
    status(t("reviewSaved"), "ok"); await reload();
  }

  async function deleteListing(id) {
    if (!confirm(t("confirmDel"))) return;
    const item = allListings.filter((x) => same(x.id, id))[0];
    const r = await sb.from("listings").delete().eq("id", id);
    if (r.error) return status(r.error.message, "err");
    if (item && item.image_url) removeImage(item.image_url);
    if (isAdmin) await sb.from("reports").delete().eq("listing_id", String(id));
    status(t("deleted"), "ok"); await reload();
  }

  async function toggleClosed(id) {
    const i = allListings.filter((x) => same(x.id, id))[0];
    if (!i) return;
    const r = await sb.from("listings").update({ closed: !i.closed }).eq("id", id);
    if (r.error) return status(t("needSql") + r.error.message, "err");
    status(t("updated"), "ok"); await reload();
  }

  document.addEventListener("click", async (e) => {
    const star = e.target.closest("[data-star]");
    if (star) { reviewStars = Number(star.dataset.star); return paintStars(); }
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const id = b.dataset.id;
    switch (b.dataset.act) {
      case "prof": return openProfile(id);
      case "login": return showView("account");
      case "fav": return toggleFav(id);
      case "share": return shareListing(id);
      case "report": return reportListing(id);
      case "edit": return startEdit(id);
      case "toggle": return toggleClosed(id);
      case "del": case "adel": return deleteListing(id);
      case "sendreview": return sendReview(id);
      case "startchat": return startConversation(b.dataset.user, b.dataset.listing);
      case "openconv": {
        const conv = conversations.find(c => same(c.id, id));
        if (conv) openChat(conv);
        return;
      }
      case "rvdel": {
        const r = await sb.from("reviews").delete().eq("id", id);
        if (r.error) return status(r.error.message, "err");
        status(t("reviewDeleted"), "ok"); return reload();
      }
      case "addadmin": {
        const input = $("adm-email");
        const roleInput = $("adm-role");
        const em = input ? input.value.trim() : "";
        const role = roleInput ? roleInput.value : "general";
        if (!em) return status(t("adminEmailMissing"), "err");
        const r = await sb.rpc("add_admin", { p_email: em, p_role: role });
        if (r.error) return status(r.error.message, "err");
        status(t("adminAdded"), "ok"); return reload();
      }
      case "rmadmin": {
        if (!confirm(t("confirmRmAdmin"))) return;
        const r = await sb.rpc("remove_admin", { p_user: id });
        if (r.error) return status(r.error.message, "err");
        status(t("adminRemoved"), "ok"); return reload();
      }
      case "rdismiss": {
        const r = await sb.from("reports").delete().eq("id", id);
        if (r.error) return status(r.error.message, "err");
        return reload();
      }
    }
  });

  /* =============================== RENDU GLOBAL & DÉMARRAGE =============================== */
  function renderAll() { renderListings(); renderPros(); renderAccount(); }

  async function init() {
    applyLang();
    if (!sb) { status(t("noLib"), "err"); return; }
    const s = await sb.auth.getSession();
    const session = s.data && s.data.session;
    if (session && session.user) {
      currentUser = session.user;
      let a = await sb.from("admins").select("user_id,role").eq("user_id", currentUser.id).maybeSingle();
      if (a.error) a = await sb.from("admins").select("user_id").eq("user_id", currentUser.id).maybeSingle();
      isAdmin = !!(a && a.data);
      isSuper = !!(a && a.data && a.data.role === "super");
      if ($("panel")) $("panel").classList.remove("hidden");
      if ($("auth")) $("auth").classList.add("hidden");
    } else {
      currentUser = null;
      isAdmin = false;
      isSuper = false;
      if ($("panel")) $("panel").classList.add("hidden");
      if ($("auth")) $("auth").classList.remove("hidden");
    }
    showView("listings");
    await loadAll();
    fillProfileForm();
    renderAll();
    if (recoveryMode) showRecovery();
  }
  init();
})();
</script>

<script>
(function () {
  "use strict";
  var D = {
    fr: {
      navTools:"Outils", tMat:"Matériaux", tMet:"Métrés", tDev:"Devis",
      matTitle:"🧱 Estimation de matériaux", mWall:"Mur en parpaings", mSlab:"Dalle / béton armé", mPlast:"Enduit / crépi",

      rBloc:"Parpaings", rCim:"Ciment", rSand:"Sable", rGrav:"Gravier", rWater:"Eau", rSteel:"Acier HA", rVol:"Volume de béton",
      uPc:"pièces", uSac:"sacs de 50 kg", fillMat:"Renseignez les dimensions pour voir le résultat.",
      note:"Estimations indicatives (béton dosé à 350 kg/m³, acier ≈ 80 kg/m³). À faire valider par un technicien.",
      addDev:"➕ Ajouter au devis", added:"Ajouté au devis !",
      metTitle:"📐 Calcul de métrés", lH:"Hauteur (m)", lOpen:"Ouvertures (m²)",
      rFloor:"Sol / plafond", rPer:"Périmètre", rGross:"Murs bruts", rWalls:"Murs nets", rVolRoom:"Volume", rTile:"Carrelage (+10 %)",
      fillMet:"Entrez la longueur et la largeur de la pièce.",
      devTitle:"🧾 Générateur de devis", lClient:"Client", lSite:"Chantier", addLine:"+ Ajouter une ligne",
      lDes:"Désignation", lQty:"Qté", lUnit:"Unité", lPu:"Prix unit. (FCFA)",
      vat:"Appliquer la TVA (19,25 %)", tHT:"Total HT", tVAT:"TVA 19,25 %", tTTC:"Total TTC", tTot:"Total",
      wa:"💬 Envoyer sur WhatsApp", copy:"📋 Copier", clear:"🗑️ Vider", copied:"Devis copié !", confirmClear:"Vider tout le devis ?",
      empty:"Aucune ligne. Ajoutez-en une ou importez depuis Matériaux.", quote:"DEVIS"
    },
    en: {
      navTools:"Tools", tMat:"Materials", tMet:"Takeoff", tDev:"Quote",
      matTitle:"🧱 Materials estimate", mWall:"Block wall", mSlab:"Slab / reinforced concrete", mPlast:"Plaster / render",
      lArea:"Area (m²)", lBloc:"Block", lLen:"Length (m)", lWid:"Width (m)", lThk:"Thickness (cm)", lTh2:"Plaster thickness (cm)", lLoss:"Waste (%)",
      rBloc:"Blocks", rCim:"Cement", rSand:"Sand", rGrav:"Gravel", rWater:"Water", rSteel:"Rebar", rVol:"Concrete volume",
      uPc:"pcs", uSac:"50 kg bags", fillMat:"Enter the dimensions to see the result.",
      note:"Indicative estimates (concrete at 350 kg/m³, steel ≈ 80 kg/m³). Have a technician validate them.",
      addDev:"➕ Add to quote", added:"Added to quote!",
      metTitle:"📐 Quantity takeoff", lH:"Height (m)", lOpen:"Openings (m²)",
      rFloor:"Floor / ceiling", rPer:"Perimeter", rGross:"Gross walls", rWalls:"Net walls", rVolRoom:"Volume", rTile:"Tiles (+10 %)",
      fillMet:"Enter the room's length and width.",
      devTitle:"🧾 Quote generator", lClient:"Client", lSite:"Site", addLine:"+ Add a line",
      lDes:"Description", lQty:"Qty", lUnit:"Unit", lPu:"Unit price (FCFA)",
      vat:"Apply VAT (19.25 %)", tHT:"Subtotal", tVAT:"VAT 19.25 %", tTTC:"Total incl. VAT", tTot:"Total",
      wa:"💬 Send on WhatsApp", copy:"📋 Copy", clear:"🗑️ Clear", copied:"Quote copied!", confirmClear:"Clear the whole quote?",
      empty:"No lines yet. Add one or import from Materials.", quote:"QUOTE"
    }
  };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function lg() { return document.documentElement.lang === "en" ? "en" : "fr"; }
  function t(k) { return D[lg()][k]; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmt(n, d) { return Number(n).toLocaleString("fr-FR", { maximumFractionDigits: d == null ? 0 : d }); }
  function rd(n) { return Math.round(n * 100) / 100; }
  function num(id) { var v = parseFloat(($("#" + id) || {}).value); return isNaN(v) ? 0 : v; }
  function val(id) { return ($("#" + id) || {}).value; }
  function lab(id, key) { return '<div><label class="tl" data-t="' + key + '"></label><input id="' + id + '" type="number" inputmode="decimal" min="0" step="any"></div>'; }

  var tt = null;
  function toast(m) {
    var e = $("#toast"); if (!e) return;
    e.textContent = m; e.className = "ok";
    clearTimeout(tt); tt = setTimeout(function () { e.classList.add("hidden"); }, 3000);
  }

  /* ---------- Interface ---------- */
  var HTML =
    '<div class="seg" id="tl-seg">' +
      '<button type="button" data-tl="mat" class="active" data-t="tMat"></button>' +
      '<button type="button" data-tl="met" data-t="tMet"></button>' +
      '<button type="button" data-tl="dev" data-t="tDev"></button>' +
    '</div>' +

    '<div id="tl-mat" class="card"><h3 data-t="matTitle"></h3>' +
      '<select id="m-type"><option value="wall" data-t="mWall"></option><option value="slab" data-t="mSlab"></option><option value="plaster" data-t="mPlast"></option></select>' +
      '<div class="g2">' +
        '<div data-for="wall plaster"><label class="tl" data-t="lArea"></label><input id="m-area" type="number" inputmode="decimal" min="0" step="any"></div>' +
        '<div data-for="wall"><label class="tl" data-t="lBloc"></label><select id="m-bloc"><option value="12.5">40×20 cm</option><option value="10">50×20 cm</option></select></div>' +
        '<div data-for="slab"><label class="tl" data-t="lLen"></label><input id="m-len" type="number" inputmode="decimal" min="0" step="any"></div>' +
        '<div data-for="slab"><label class="tl" data-t="lWid"></label><input id="m-wid" type="number" inputmode="decimal" min="0" step="any"></div>' +
        '<div data-for="slab"><label class="tl" data-t="lThk"></label><input id="m-thk" type="number" inputmode="decimal" min="0" step="any" value="15"></div>' +
        '<div data-for="plaster"><label class="tl" data-t="lTh2"></label><input id="m-th2" type="number" inputmode="decimal" min="0" step="any" value="2"></div>' +
        '<div data-for="all"><label class="tl" data-t="lLoss"></label><input id="m-loss" type="number" inputmode="decimal" min="0" step="any" value="5"></div>' +
      '</div>' +
      '<div id="m-out"></div>' +
      '<p class="tl-note" data-t="note"></p>' +
      '<button type="button" class="btn" id="m-add" data-t="addDev"></button>' +
    '</div>' +

    '<div id="tl-met" class="card hidden"><h3 data-t="metTitle"></h3>' +
      '<div class="g2">' + lab("t-len", "lLen") + lab("t-wid", "lWid") + lab("t-h", "lH") + lab("t-open", "lOpen") + '</div>' +
      '<div id="t-out"></div>' +
    '</div>' +

    '<div id="tl-dev" class="card hidden"><h3 data-t="devTitle"></h3>' +
      '<div class="g2">' +
        '<div><label class="tl" data-t="lClient"></label><input id="d-client" type="text"></div>' +
        '<div><label class="tl" data-t="lSite"></label><input id="d-site" type="text"></div>' +
      '</div>' +
      '<div id="d-lines"></div>' +
      '<button type="button" class="btn gray" id="d-add" data-t="addLine"></button>' +
      '<label class="chk"><input type="checkbox" id="d-vat"><span data-t="vat"></span></label>' +
      '<div id="d-tot"></div>' +
      '<button type="button" class="btn wa" id="d-wa" data-t="wa"></button>' +
      '<div class="g2" style="margin:8px 0 0"><button type="button" class="btn gray" id="d-copy" data-t="copy"></button><button type="button" class="btn red" id="d-clear" data-t="clear"></button></div>' +
    '</div>';

  var main = $("main"), nav = $("nav");
  if (!main || !nav) return;
  var sec = document.createElement("section");
  sec.id = "view-tools"; sec.className = "hidden"; sec.innerHTML = HTML;
  main.insertBefore(sec, $("footer", main));

  var btn = document.createElement("button");
  btn.type = "button"; btn.setAttribute("data-view", "tools");
  btn.innerHTML = '<span>🧰</span><b data-t="navTools"></b>';
  nav.insertBefore(btn, $("nav button[data-view=account]"));

  /* ---------- Navigation ---------- */
  var VIEWS = ["listings", "pros", "profile", "publish", "account", "messages"];
  btn.addEventListener("click", function () {
    VIEWS.forEach(function (n) { var e = $("#view-" + n); if (e) e.classList.add("hidden"); });
    sec.classList.remove("hidden");
    var h = $("#hero"); if (h) h.classList.add("hidden");
    $$("nav button").forEach(function (b) { b.classList.toggle("active", b === btn); });
    window.scrollTo(0, 0);
  });
  $$("nav button").forEach(function (b) {
    if (b !== btn) b.addEventListener("click", function () { sec.classList.add("hidden"); });
  });
  function go(name) {
    ["mat", "met", "dev"].forEach(function (n) { $("#tl-" + n).classList.toggle("hidden", n !== name); });
    $$("#tl-seg button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tl") === name); });
  }
  $("#tl-seg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tl]"); if (b) go(b.getAttribute("data-tl"));
  });

  /* ---------- Matériaux ---------- */
  var lastMat = [];
  function calcMat() {
    var ty = val("m-type"), k = 1 + num("m-loss") / 100, a, v, m;
    if (ty === "wall") {
      a = num("m-area");
      if (a > 0) {
        m = a * 0.025 * k; // mortier de pose, m³
        return [["rBloc", Math.ceil(a * parseFloat(val("m-bloc")) * k), "uPc"], ["rCim", Math.ceil(m * 7), "uSac"], ["rSand", rd(m), "m³"]];
      }
    } else if (ty === "slab") {
      v = num("m-len") * num("m-wid") * num("m-thk") / 100 * k;
      if (v > 0) return [["rVol", rd(v), "m³"], ["rCim", Math.ceil(v * 7), "uSac"], ["rSand", rd(v * 0.4), "m³"], ["rGrav", rd(v * 0.8), "m³"], ["rWater", Math.ceil(v * 175), "L"], ["rSteel", Math.ceil(v * 80), "kg"]];
    } else {
      a = num("m-area"); v = a * num("m-th2") / 100 * k;
      if (v > 0) return [["rCim", Math.ceil(v * 7), "uSac"], ["rSand", rd(v), "m³"]];
    }
    return [];
  }
  function renderMat() {
    $$("#tl-mat [data-for]").forEach(function (d) {
      var f = d.getAttribute("data-for");
      d.classList.toggle("hidden", f !== "all" && f.split(" ").indexOf(val("m-type")) < 0);
    });
    lastMat = calcMat();
    $("#m-out").innerHTML = lastMat.length
      ? lastMat.map(function (x) { return '<div class="res"><span>' + esc(t(x[0])) + "</span><b>" + fmt(x[1], 2) + " " + esc(t(x[2]) || x[2]) + "</b></div>"; }).join("")
      : '<p class="empty">' + esc(t("fillMat")) + "</p>";
    $("#m-add").classList.toggle("hidden", !lastMat.length);
  }
  ["m-type", "m-area", "m-bloc", "m-len", "m-wid", "m-thk", "m-th2", "m-loss"].forEach(function (id) {
    $("#" + id).addEventListener("input", renderMat);
    $("#" + id).addEventListener("change", renderMat);
  });
  $("#m-add").addEventListener("click", function () {
    lastMat.forEach(function (x) {
      if (x[0] === "rVol") return;
      S.items.push({ d: t(x[0]), q: x[1], u: t(x[2]) || x[2], p: 0 });
    });
    save(); renderLines(); go("dev"); toast(t("added"));
  });

  /* ---------- Métrés ---------- */
  function renderMet() {
    var L = num("t-len"), W = num("t-wid"), H = num("t-h"), O = num("t-open"), r = [];
    if (L > 0 && W > 0) {
      var fl = L * W;
      r.push(["rFloor", fl, "m²"], ["rTile", fl * 1.1, "m²"], ["rPer", 2 * (L + W), "m"]);
      if (H > 0) {
        var g = 2 * (L + W) * H;
        r.push(["rGross", g, "m²"], ["rWalls", Math.max(0, g - O), "m²"], ["rVolRoom", fl * H, "m³"]);
      }
    }
    $("#t-out").innerHTML = r.length
      ? r.map(function (x) { return '<div class="res"><span>' + esc(t(x[0])) + "</span><b>" + fmt(x[1], 2) + " " + x[2] + "</b></div>"; }).join("")
      : '<p class="empty">' + esc(t("fillMet")) + "</p>";
  }
  ["t-len", "t-wid", "t-h", "t-open"].forEach(function (id) { $("#" + id).addEventListener("input", renderMet); });

  /* ---------- Devis ---------- */
  var S = { client: "", site: "", vat: false, items: [] };
  try {
    var j = JSON.parse(localStorage.getItem("btp_devis") || "null");
    if (j && Array.isArray(j.items)) S = j;
  } catch (e) {}
  function save() { try { localStorage.setItem("btp_devis", JSON.stringify(S)); } catch (e) {} }
  function sum() { return S.items.reduce(function (a, it) { return a + (it.q || 0) * (it.p || 0); }, 0); }
  function rr(label, v, big) { return '<div class="res' + (big ? " big" : "") + '"><span>' + esc(label) + "</span><b>" + fmt(v) + " FCFA</b></div>"; }

  function totals() {
    var ht = sum(), tva = S.vat ? ht * 0.1925 : 0;
    $("#d-tot").innerHTML = S.vat ? rr(t("tHT"), ht) + rr(t("tVAT"), tva) + rr(t("tTTC"), ht + tva, true) : rr(t("tTot"), ht, true);
  }
  function renderLines() {
    $("#d-lines").innerHTML = S.items.length ? S.items.map(function (it, i) {
      return '<div class="ad line" data-i="' + i + '">' +
        '<input data-f="d" type="text" placeholder="' + esc(t("lDes")) + '" value="' + esc(it.d) + '">' +
        '<div class="g3">' +
          '<input data-f="q" type="number" inputmode="decimal" min="0" step="any" placeholder="' + esc(t("lQty")) + '" value="' + esc(it.q || "") + '">' +
          '<input data-f="u" type="text" placeholder="' + esc(t("lUnit")) + '" value="' + esc(it.u) + '">' +
          '<input data-f="p" type="number" inputmode="decimal" min="0" step="any" placeholder="' + esc(t("lPu")) + '" value="' + esc(it.p || "") + '">' +
        '</div>' +
        '<div class="acts" style="justify-content:space-between;align-items:center"><b class="lt">' + fmt((it.q || 0) * (it.p || 0)) + ' FCFA</b>' +
        '<button type="button" class="ib danger" data-del="' + i + '">🗑️</button></div></div>';
    }).join("") : '<p class="empty">' + esc(t("empty")) + "</p>";
    totals();
  }
  $("#d-lines").addEventListener("input", function (e) {
    var el = e.target, row = el.closest("[data-i]"), f = el.getAttribute("data-f");
    if (!row || !f) return;
    var it = S.items[Number(row.getAttribute("data-i"))];
    it[f] = (f === "q" || f === "p") ? (parseFloat(el.value) || 0) : el.value;
    $(".lt", row).textContent = fmt((it.q || 0) * (it.p || 0)) + " FCFA";
    totals(); save();
  });
  $("#d-lines").addEventListener("click", function (e) {
    var b = e.target.closest("[data-del]"); if (!b) return;
    S.items.splice(Number(b.getAttribute("data-del")), 1); save(); renderLines();
  });
  $("#d-add").addEventListener("click", function () { S.items.push({ d: "", q: 1, u: "", p: 0 }); save(); renderLines(); });
  $("#d-client").value = S.client || ""; $("#d-site").value = S.site || ""; $("#d-vat").checked = !!S.vat;
  $("#d-client").addEventListener("input", function () { S.client = this.value; save(); });
  $("#d-site").addEventListener("input", function () { S.site = this.value; save(); });
  $("#d-vat").addEventListener("change", function () { S.vat = this.checked; save(); totals(); });

  function quoteText() {
    var ht = sum(), tva = S.vat ? ht * 0.1925 : 0, L = [];
    L.push("🧾 " + t("quote") + " — BTP-Connect");
    if (S.client) L.push(t("lClient") + " : " + S.client);
    if (S.site) L.push(t("lSite") + " : " + S.site);
    L.push(new Date().toLocaleDateString(lg() === "en" ? "en-GB" : "fr-FR"), "");
    S.items.forEach(function (it, i) {
      if (!it.d && !it.p) return;
      L.push((i + 1) + ". " + (it.d || "—") + " — " + fmt(it.q || 0, 2) + " " + (it.u || "") + " × " + fmt(it.p || 0) + " = " + fmt((it.q || 0) * (it.p || 0)) + " FCFA");
    });
    L.push("");
    if (S.vat) { L.push(t("tHT") + " : " + fmt(ht) + " FCFA"); L.push(t("tVAT") + " : " + fmt(tva) + " FCFA"); L.push(t("tTTC") + " : " + fmt(ht + tva) + " FCFA"); }
    else L.push(t("tTot") + " : " + fmt(ht) + " FCFA");
    return L.join("\n");
  }
  $("#d-wa").addEventListener("click", function () { window.open("https://wa.me/?text=" + encodeURIComponent(quoteText()), "_blank"); });
  $("#d-copy").addEventListener("click", function () {
    var x = quoteText();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(x).then(function () { toast(t("copied")); }, function () { prompt("", x); });
    else prompt("", x);
  });
  $("#d-clear").addEventListener("click", function () {
    if (!confirm(t("confirmClear"))) return;
    S = { client: "", site: "", vat: false, items: [] };
    $("#d-client").value = ""; $("#d-site").value = ""; $("#d-vat").checked = false;
    save(); renderLines();
  });

  /* ---------- Langue & démarrage ---------- */
  function applyT() {
    $$("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
    renderMat(); renderMet(); renderLines();
  }
  var sel = $("#lang");
  if (sel) sel.addEventListener("change", function () { applyT(); });
  applyT();
})();
</script>

</body>
</html>
