<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTP-Connect | Cameroun</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--amber:#d97706;--amber-l:#f59e0b;--navy:#111827;--gray:#6b7280;--line:#d1d5db;--bg:#f8fafc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-text-size-adjust:100%;padding-bottom:84px}
  header{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 #e5e7eb}
  .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:-.5px}
  .logo i{width:38px;height:38px;background:var(--amber);border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:20px}
  .logo b{color:var(--amber)}
  select{font:inherit;font-weight:700;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#f9fafb;color:var(--navy)}
  .hero{background:linear-gradient(110deg,#111827 0%,#1f2937 60%,#451a03 100%);padding:36px 20px 40px;text-align:center;color:#fff}
  .badge{display:inline-block;border:1px solid rgba(245,158,11,.5);background:rgba(245,158,11,.15);color:var(--amber-l);font-weight:800;font-size:11px;letter-spacing:1px;padding:7px 14px;border-radius:999px;text-transform:uppercase}
  .hero h2{font-size:28px;line-height:1.2;font-weight:800;margin:16px 0 12px}
  .hero h2 .acc{color:var(--amber-l)}
  .hero p{color:#d1d5db;font-size:14px;line-height:1.5}
  main{max-width:520px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06);margin-bottom:16px}
  .tabs{display:flex;border-bottom:2px solid #e5e7eb;margin-bottom:20px}
  .tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 0;font:inherit;font-weight:700;font-size:17px;color:#9ca3af;cursor:pointer}
  .tabs button.active{color:var(--amber);border-bottom-color:var(--amber)}
  h3{font-size:19px;font-weight:800;margin-bottom:14px}
  input,.card select,textarea{display:block;width:100%;font:inherit;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);border-color:var(--amber)}
  .pwd{position:relative;margin-bottom:12px}
  .pwd input{margin-bottom:0;padding-right:52px}
  .pwd .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;background:none;border:0;font-size:20px;cursor:pointer}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--amber);cursor:pointer;text-align:center;text-decoration:none;display:block}
  .btn:disabled{opacity:.6}
  .btn.red{background:#fee2e2;color:#dc2626}
  .btn.wa{background:#16a34a;padding:10px;font-size:14px;margin-top:10px}
  .btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:13px}
  .hidden{display:none!important}
  #status{font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:14px;background:#fffbeb;border-left:4px solid var(--amber-l);color:#92400e}
  #status.err{background:#fef2f2;border-color:#dc2626;color:#991b1b}
  #status.ok{background:#ecfdf5;border-color:#10b981;color:#065f46}
  .welcome{color:#059669;font-weight:700;font-size:17px}
  .role{color:var(--gray);font-size:13px;margin:2px 0 16px}
  .ad{background:#fff;border:1px solid #e5e7eb;border-left:4px solid var(--amber);border-radius:14px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.5}
  .ad h4{font-size:16px;font-weight:800}
  .ad .p{color:#059669;font-weight:800;font-size:16px;margin-top:4px}
  .ad .m{color:var(--gray);font-size:12px;margin-top:2px}
  .ad img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:#f3f4f6;display:block}
  .photo-pick{display:block;border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--gray);font-weight:700;font-size:14px;margin-bottom:12px;cursor:pointer}
  .photo-pick img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:10px;display:block}
  .photo-pick input{display:none}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .filters select,.filters input{margin-bottom:0;padding:11px;font-size:15px}
  .filters .full{grid-column:1/-1}
  .fbar{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;font-size:13px;color:var(--gray)}
  .fbar button{background:none;border:0;color:var(--amber);font:inherit;font-weight:700;cursor:pointer}
  .lnk{background:none;border:0;color:var(--amber);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
  .tag{display:inline-block;background:#fffbeb;color:#92400e;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:6px 6px 0 0}
  .av{width:54px;height:54px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
  .prow{display:flex;gap:12px;align-items:center}
  .bio{margin-top:10px;white-space:pre-wrap}
  .back{margin-bottom:12px}
  .sub{font-size:15px;font-weight:800;margin:18px 0 10px}
  .empty{text-align:center;color:var(--gray);padding:24px 8px;font-size:14px}
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
  nav button{flex:1;background:none;border:0;font:inherit;font-size:12px;font-weight:700;color:#9ca3af;padding:6px 0;cursor:pointer}
  nav button span{display:block;font-size:22px}
  nav button.active{color:var(--amber)}
  footer{text-align:center;font-size:11px;color:#9ca3af;padding:6px 0 0}
</style>
</head>
<body>

<header>
  <div class="logo"><i>👷</i><span>BTP-<b>Connect</b></span></div>
  <select id="lang"><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option></select>
</header>

<section class="hero" id="hero">
  <span class="badge" data-i18n="badge"></span>
  <h2><span data-i18n="h1a"></span> <span class="acc" data-i18n="h1b"></span></h2>
  <p data-i18n="sub"></p>
</section>

<main>
  <div id="status">…</div>

  <!-- ===== ONGLET ANNONCES ===== -->
  <section id="view-listings">
    <input id="q" type="search" data-ph="search" placeholder="Rechercher…">
    <div class="filters">
      <select id="f-cat"></select>
      <select id="f-city"></select>
      <input id="f-price" type="number" inputmode="numeric" min="0" data-ph="maxPrice">
      <select id="f-sort">
        <option value="recent" data-i18n="sRecent"></option>
        <option value="asc" data-i18n="sAsc"></option>
        <option value="desc" data-i18n="sDesc"></option>
      </select>
    </div>
    <div class="fbar"><span id="count"></span><button type="button" id="f-reset" data-i18n="reset"></button></div>
    <div id="listings"></div>
  </section>

  <!-- ===== ONGLET PROS ===== -->
  <section id="view-pros" class="hidden">
    <input id="pq" type="search" data-ph="proSearch">
    <div id="pros"></div>
  </section>

  <!-- ===== PAGE PROFIL ===== -->
  <section id="view-profile" class="hidden">
    <button type="button" class="btn red back" id="back-pros" data-i18n="back"></button>
    <div id="profile-box" class="card"></div>
  </section>

  <!-- ===== ONGLET PUBLIER ===== -->
  <section id="view-publish" class="hidden">
    <div id="pub-locked" class="card hidden">
      <p class="empty" data-i18n="needLogin"></p>
      <button type="button" class="btn" id="go-account" data-i18n="goLogin"></button>
    </div>
    <div id="pub-form-card" class="card hidden">
      <h3 data-i18n="pubTitle"></h3>
      <form id="form-listing" novalidate>
        <input id="li-title" type="text" data-ph="pTitle">
        <textarea id="li-desc" rows="4" data-ph="pDesc"></textarea>
        <select id="li-cat">
          <option value="" data-i18n="chooseCat"></option>
          <option>Gros œuvre</option><option>Plomberie</option><option>Électricité</option>
          <option>Menuiserie</option><option>Carrelage & peinture</option>
          <option>Matériaux de construction</option><option>Location d'engins</option><option>Autre</option>
        </select>
        <input id="li-price" type="number" inputmode="numeric" min="0" data-ph="pPrice">
        <input id="li-city" type="text" value="Douala" data-ph="pCity">
        <label class="photo-pick" id="photo-label">
          <span id="photo-text" data-i18n="addPhoto"></span>
          <input id="li-photo" type="file" accept="image/*">
          <img id="photo-preview" class="hidden" alt="">
        </label>
        <button class="btn" type="submit" data-i18n="pubBtn"></button>
      </form>
    </div>
  </section>

  <!-- ===== ONGLET COMPTE ===== -->
  <section id="view-account" class="hidden">
    <div id="auth" class="card hidden">
      <div class="tabs">
        <button type="button" id="tab-login" class="active" data-i18n="tabLogin"></button>
        <button type="button" id="tab-signup" data-i18n="tabSignup"></button>
      </div>

      <form id="form-login" novalidate>
        <h3 data-i18n="loginTitle"></h3>
        <input id="lo-email" type="email" autocomplete="email" data-ph="email">
        <div class="pwd">
          <input id="lo-pass" type="password" autocomplete="current-password" data-ph="pass">
          <button type="button" class="eye" data-target="lo-pass" aria-label="Afficher / masquer">👁️</button>
        </div>
        <button class="btn" type="submit" data-i18n="loginBtn"></button>
      </form>

      <form id="form-signup" class="hidden" novalidate>
        <h3 data-i18n="signupTitle"></h3>
        <input id="su-name" type="text" autocomplete="name" data-ph="name">
        <input id="su-email" type="email" autocomplete="email" data-ph="email">
        <input id="su-phone" type="tel" autocomplete="tel" data-ph="phone">
        <select id="su-type">
          <option value="client" data-i18n="tClient"></option>
          <option value="artisan" data-i18n="tArtisan"></option>
          <option value="entreprise" data-i18n="tCompany"></option>
        </select>
        <div class="pwd">
          <input id="su-pass" type="password" autocomplete="new-password" data-ph="pass6">
          <button type="button" class="eye" data-target="su-pass" aria-label="Afficher / masquer">👁️</button>
        </div>
        <div class="pwd">
          <input id="su-pass2" type="password" autocomplete="new-password" data-ph="pass2">
          <button type="button" class="eye" data-target="su-pass2" aria-label="Afficher / masquer">👁️</button>
        </div>
        <button class="btn" type="submit" data-i18n="signupBtn"></button>
      </form>
    </div>

    <div id="panel" class="card hidden">
      <p id="welcome" class="welcome"></p>
      <p id="role" class="role"></p>
      <h3 data-i18n="myProfile"></h3>
      <form id="form-profile" novalidate>
        <input id="pf-city" type="text" data-ph="pCity">
        <select id="pf-spec"></select>
        <textarea id="pf-bio" rows="4" data-ph="bioPh"></textarea>
        <button class="btn" type="submit" data-i18n="saveProfile"></button>
      </form>
      <h3 data-i18n="mine" style="margin-top:22px"></h3>
      <div id="mine"></div>
      <button type="button" id="logout" class="btn red" style="margin-top:12px" data-i18n="logout"></button>
    </div>
  </section>

  <footer>BTP-Connect · v7</footer>
</main>

<nav>
  <button type="button" data-view="listings" class="active"><span>📢</span><b data-i18n="navAds"></b></button>
  <button type="button" data-view="publish"><span>➕</span><b data-i18n="navPub"></b></button>
  <button type="button" data-view="pros"><span>👷</span><b data-i18n="navPros"></b></button>
  <button type="button" data-view="account"><span>👤</span><b data-i18n="navAcc"></b></button>
</nav>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  /* ================= Traductions ================= */
  var T = {
    fr: {
      badge:"Cameroun • Bâtiment & Travaux Publics", h1a:"L'infrastructure et l'expertise BTP", h1b:"à portée de main",
      sub:"Trouvez les meilleurs professionnels qualifiés ou accédez à des offres de matériaux et services BTP.",
      navAds:"Annonces", navPub:"Publier", navAcc:"Compte",
      tabLogin:"Connexion", tabSignup:"S'inscrire", loginTitle:"Se connecter à son compte", loginBtn:"Se connecter",
      signupTitle:"Créer un compte", signupBtn:"S'inscrire maintenant", logout:"Se déconnecter",
      tClient:"Client / Maître d'ouvrage", tArtisan:"Artisan / Mettreur qualifié", tCompany:"Entreprise BTP / Fournisseur",
      pubTitle:"📢 Publier une offre", pubBtn:"Publier l'annonce", mine:"Mes annonces",
      needLogin:"Connectez-vous pour publier une annonce.", goLogin:"Aller à la connexion",
      ph:{ email:"Adresse e-mail", pass:"Mot de passe", name:"Nom complet", phone:"Téléphone / WhatsApp",
           pass6:"Mot de passe (6 caractères min.)", pass2:"Confirmer le mot de passe",
           pTitle:"Titre (ex : Vente de ciment, Maçon qualifié)", pDesc:"Description détaillée",
           pCat:"Catégorie (ex : Gros œuvre, Matériaux)", pPrice:"Prix en FCFA", pCity:"Ville",
           search:"🔍 Rechercher (ciment, maçon, Douala…)", maxPrice:"Prix max (FCFA)", proSearch:"🔍 Rechercher un pro (nom, ville, spécialité…)", bioPh:"Présentez-vous : expérience, services, réalisations…" },
      roles:{ client:"Client / Maître d'ouvrage", artisan:"Artisan / Mettreur qualifié", entreprise:"Entreprise BTP / Fournisseur" },
      ready:"Système prêt.", noLib:"Impossible de charger Supabase. Vérifiez votre connexion.",
      fill:"Veuillez remplir tous les champs.", short:"Le mot de passe doit contenir au moins 6 caractères.",
      mismatch:"Les mots de passe ne correspondent pas.", signing:"Inscription en cours…", logging:"Connexion en cours…",
      createdOk:"Compte créé avec succès.", confirmMail:"Compte créé ! Vérifiez vos e-mails pour confirmer, puis connectez-vous.",
      welcome:"✅ Connecté : ", none:"Aucune annonce pour le moment.", noneMine:"Vous n'avez publié aucune annonce.",
      errAds:"Erreur de chargement : ", pubOk:"Annonce publiée avec succès !", relog:"Veuillez vous reconnecter.",
      publishing:"Publication en cours…", del:"Supprimer", confirmDel:"Supprimer cette annonce ?", deleted:"Annonce supprimée.",
      wa:"💬 Contacter sur WhatsApp", loading:"Chargement…", navPros:"Pros", back:"← Retour", myProfile:"Mon profil professionnel", saveProfile:"Enregistrer mon profil", profileSaved:"Profil enregistré !", noPros:"Aucun professionnel pour le moment.", viewProfile:"Voir le profil", spec0:"Choisir ma spécialité", listingsOf:"Annonces publiées", noBio:"Pas encore de description.", by:"Par ", profErr:"Profil non enregistré : ", allCats:"Toutes catégories", allCities:"Toutes les villes", sRecent:"Plus récentes", sAsc:"Prix croissant", sDesc:"Prix décroissant", reset:"Réinitialiser", chooseCat:"Choisir une catégorie", nAds:" annonce(s)", addPhoto:"📷 Ajouter une photo (optionnel)", changePhoto:"📷 Changer la photo", uploading:"Envoi de la photo…", imgErr:"Photo non envoyée : "
    },
    en: {
      badge:"Cameroon • Building & Public Works", h1a:"Infrastructure and construction expertise", h1b:"within reach",
      sub:"Find qualified professionals or access construction materials and services offers.",
      navAds:"Listings", navPub:"Publish", navAcc:"Account",
      tabLogin:"Log in", tabSignup:"Sign up", loginTitle:"Log in to your account", loginBtn:"Log in",
      signupTitle:"Create an account", signupBtn:"Sign up now", logout:"Log out",
      tClient:"Client / Project owner", tArtisan:"Qualified craftsman / Installer", tCompany:"Construction company / Supplier",
      pubTitle:"📢 Publish an offer", pubBtn:"Publish listing", mine:"My listings",
      needLogin:"Log in to publish a listing.", goLogin:"Go to login",
      ph:{ email:"Email address", pass:"Password", name:"Full name", phone:"Phone / WhatsApp",
           pass6:"Password (min. 6 characters)", pass2:"Confirm password",
           pTitle:"Title (e.g. Cement sale, Qualified mason)", pDesc:"Detailed description",
           pCat:"Category (e.g. Structural, Materials)", pPrice:"Price in FCFA", pCity:"City",
           search:"🔍 Search (cement, mason, Douala…)", maxPrice:"Max price (FCFA)", proSearch:"🔍 Find a pro (name, city, specialty…)", bioPh:"Introduce yourself: experience, services, past work…" },
      roles:{ client:"Client / Project owner", artisan:"Qualified craftsman / Installer", entreprise:"Construction company / Supplier" },
      ready:"System ready.", noLib:"Could not load Supabase. Check your connection.",
      fill:"Please fill in all fields.", short:"Password must be at least 6 characters.",
      mismatch:"Passwords do not match.", signing:"Signing up…", logging:"Logging in…",
      createdOk:"Account created successfully.", confirmMail:"Account created! Check your email to confirm, then log in.",
      welcome:"✅ Logged in: ", none:"No listings yet.", noneMine:"You have not published any listing.",
      errAds:"Could not load listings: ", pubOk:"Listing published successfully!", relog:"Please log in again.",
      publishing:"Publishing…", del:"Delete", confirmDel:"Delete this listing?", deleted:"Listing deleted.",
      wa:"💬 Contact on WhatsApp", loading:"Loading…", navPros:"Pros", back:"← Back", myProfile:"My professional profile", saveProfile:"Save my profile", profileSaved:"Profile saved!", noPros:"No professionals yet.", viewProfile:"View profile", spec0:"Choose my specialty", listingsOf:"Published listings", noBio:"No description yet.", by:"By ", profErr:"Profile not saved: ", allCats:"All categories", allCities:"All cities", sRecent:"Most recent", sAsc:"Price: low to high", sDesc:"Price: high to low", reset:"Reset", chooseCat:"Choose a category", nAds:" listing(s)", addPhoto:"📷 Add a photo (optional)", changePhoto:"📷 Change photo", uploading:"Uploading photo…", imgErr:"Photo not uploaded: "
    }
  };
  var lang = localStorage.getItem("lang") || "fr";
  function t(k) { return T[lang][k]; }

  var sb = null, currentUser = null, allListings = [], currentView = "listings";

  function applyLang() {
    document.documentElement.lang = lang;
    $("lang").value = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T[lang][el.getAttribute("data-i18n")]; });
    document.querySelectorAll("[data-ph]").forEach(function (el) { el.placeholder = T[lang].ph[el.getAttribute("data-ph")]; });
    if (currentUser) renderUser();
    renderListings();
    renderPros();
    fillProfileForm();
  }

  function status(msg, kind) { var s = $("status"); s.textContent = msg; s.className = kind || ""; window.scrollTo({top:0,behavior:"smooth"}); }
  window.addEventListener("error", function (e) { status("Erreur JS : " + e.message, "err"); });
  window.addEventListener("unhandledrejection", function (e) { status("Erreur : " + ((e.reason && e.reason.message) || e.reason), "err"); });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  try {
    sb = window.supabase.createClient(
      "https://rbquptvfvqykhlekwwgc.supabase.co",
      "sb_publishable_ZyAvi5UYSblQfE8AYghvPQ_o-90ihPa"
    );
  } catch (e) { sb = null; }

  /* ================= Navigation ================= */
  function showView(v) {
    currentView = v;
    ["listings","pros","profile","publish","account"].forEach(function (n) { $("view-" + n).classList.toggle("hidden", n !== v); });
    var navV = v === "profile" ? "pros" : v;
    document.querySelectorAll("nav button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-view") === navV); });
    $("hero").classList.toggle("hidden", v !== "listings" || !!currentUser);
    if (v === "publish") {
      $("pub-locked").classList.toggle("hidden", !!currentUser);
      $("pub-form-card").classList.toggle("hidden", !currentUser);
    }
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () { showView(b.getAttribute("data-view")); });
  });
  $("go-account").addEventListener("click", function () { showView("account"); });

  function showTab(name) {
    var login = name === "login";
    $("form-login").classList.toggle("hidden", !login);
    $("form-signup").classList.toggle("hidden", login);
    $("tab-login").classList.toggle("active", login);
    $("tab-signup").classList.toggle("active", !login);
  }
  $("tab-login").addEventListener("click", function () { showTab("login"); });
  $("tab-signup").addEventListener("click", function () { showTab("signup"); });

  $("lang").addEventListener("change", function (e) {
    lang = e.target.value; localStorage.setItem("lang", lang); applyLang(); status(t("ready"));
  });

  /* ============ Bouton œil (tous les mots de passe) ============ */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".eye");
    if (!btn) return;
    var input = $(btn.getAttribute("data-target"));
    var show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.textContent = show ? "🙈" : "👁️";
  });

  /* ================= Profil ================= */
  async function ensureProfile(user) {
    var m = user.user_metadata || {};
    if (!m.full_name) return;
    var r = await sb.from("profiles").select("id").eq("id", user.id).maybeSingle();
    if (r.data) return;
    var ins = await sb.from("profiles").insert([{ id: user.id, full_name: m.full_name, phone: m.phone, user_type: m.user_type }]);
    if (ins.error) console.warn("Profil :", ins.error.message);
  }

  function renderUser() {
    var m = currentUser.user_metadata || {};
    $("welcome").textContent = t("welcome") + (m.full_name || currentUser.email);
    $("role").textContent = (T[lang].roles[m.user_type] || "") + " · " + currentUser.email;
  }

  /* ================= Inscription ================= */
  $("form-signup").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!sb) return status(t("noLib"), "err");
    var name = $("su-name").value.trim(), email = $("su-email").value.trim(),
        phone = $("su-phone").value.trim(), type = $("su-type").value,
        pass = $("su-pass").value, pass2 = $("su-pass2").value;
    if (!name || !email || !phone || !pass) return status(t("fill"), "err");
    if (pass.length < 6) return status(t("short"), "err");
    if (pass !== pass2) return status(t("mismatch"), "err");

    var btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    status(t("signing"));
    var r = await sb.auth.signUp({ email: email, password: pass,
      options: { data: { full_name: name, phone: phone, user_type: type } } });
    btn.disabled = false;
    if (r.error) return status(r.error.message, "err");

    if (r.data.session && r.data.user) {
      await ensureProfile(r.data.user);
      status(t("createdOk"), "ok");
      setTimeout(function () { location.reload(); }, 700);
    } else {
      status(t("confirmMail"), "ok");
      showTab("login");
    }
  });

  /* ================= Connexion ================= */
  $("form-login").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!sb) return status(t("noLib"), "err");
    var email = $("lo-email").value.trim(), pass = $("lo-pass").value;
    if (!email || !pass) return status(t("fill"), "err");

    var btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    status(t("logging"));
    var r = await sb.auth.signInWithPassword({ email: email, password: pass });
    btn.disabled = false;
    if (r.error) return status(r.error.message, "err");
    await ensureProfile(r.data.user);
    location.reload();
  });

  $("logout").addEventListener("click", async function () {
    if (sb) await sb.auth.signOut();
    location.reload();
  });

  /* ================= Publication ================= */
  $("form-listing").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!sb || !currentUser) return status(t("relog"), "err");
    var title = $("li-title").value.trim(), desc = $("li-desc").value.trim(),
        cat = $("li-cat").value.trim(), price = parseFloat($("li-price").value),
        city = $("li-city").value.trim();
    if (!title || !desc || !cat || isNaN(price) || !city) return status(t("fill"), "err");

    var btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    status(t("publishing"));
    var imageUrl = null, imagePath = null;
    var file = $("li-photo").files[0];
    if (file) {
      status(t("uploading"));
      try {
        var blob = await compressImage(file);
        imagePath = currentUser.id + "/" + Date.now() + ".jpg";
        var up = await sb.storage.from("listing-images").upload(imagePath, blob, { contentType: "image/jpeg" });
        if (up.error) throw up.error;
        imageUrl = sb.storage.from("listing-images").getPublicUrl(imagePath).data.publicUrl;
      } catch (err) {
        btn.disabled = false;
        return status(t("imgErr") + (err.message || err), "err");
      }
      status(t("publishing"));
    }
    var row = { image_url: imageUrl, title: title, description: desc, category: cat, price: price, city: city,
                provider_id: currentUser.id, phone: (currentUser.user_metadata || {}).phone || null };
    var r = await sb.from("listings").insert([row]);
    // Si la colonne "phone" n'existe pas encore, on réessaie sans elle
    if (r.error && /phone/i.test(r.error.message)) { delete row.phone; r = await sb.from("listings").insert([row]); }
    if (r.error && /image_url/i.test(r.error.message)) { delete row.image_url; r = await sb.from("listings").insert([row]); }
    btn.disabled = false;

    if (r.error) return status("Erreur : " + r.error.message, "err");
    status(t("pubOk"), "ok");
    $("form-listing").reset(); $("li-city").value = city; resetPhoto();
    await loadListings();
    showView("listings");
  });

  /* ================= Profils & annuaire ================= */
  var profiles = {};
  async function loadProfiles() {
    if (!sb) return;
    var r = await sb.from("profiles").select("*");
    if (r.error) { console.warn("Profils :", r.error.message); return; }
    profiles = {};
    (r.data || []).forEach(function (p) { profiles[p.id] = p; });
  }

  function proCard(p) {
    var n = allListings.filter(function (i) { return i.provider_id === p.id; }).length;
    return '<div class="ad"><div class="prow"><div class="av">' + esc((p.full_name || "?").charAt(0).toUpperCase()) + '</div>' +
      "<div><h4>" + esc(p.full_name) + '</h4><div class="m">' + esc(T[lang].roles[p.user_type] || "") + "</div></div></div>" +
      (p.specialty ? '<span class="tag">' + esc(p.specialty) + "</span>" : "") +
      (p.city ? '<span class="tag">📍 ' + esc(p.city) + "</span>" : "") +
      (n ? '<span class="tag">' + n + t("nAds") + "</span>" : "") +
      '<button type="button" class="btn sm" style="margin-top:12px" data-prof="' + esc(p.id) + '">' + esc(t("viewProfile")) + "</button></div>";
  }

  function renderPros() {
    var q = ($("pq").value || "").toLowerCase().trim();
    var list = Object.keys(profiles).map(function (k) { return profiles[k]; }).filter(function (p) {
      if (p.user_type === "client") return false;
      if (!q) return true;
      return [p.full_name, p.city, p.specialty, p.bio].join(" ").toLowerCase().indexOf(q) !== -1;
    });
    $("pros").innerHTML = list.length ? list.map(proCard).join("") : '<p class="empty">' + esc(t("noPros")) + "</p>";
  }
  $("pq").addEventListener("input", renderPros);

  function openProfile(id) {
    var p = profiles[id];
    if (!p) return;
    var wa = waLink(p.phone);
    var mine = allListings.filter(function (i) { return i.provider_id === id; });
    $("profile-box").innerHTML =
      '<div class="prow"><div class="av">' + esc((p.full_name || "?").charAt(0).toUpperCase()) + "</div>" +
      "<div><h3 style=\"margin:0\">" + esc(p.full_name) + '</h3><div class="m">' + esc(T[lang].roles[p.user_type] || "") + "</div></div></div>" +
      (p.specialty ? '<span class="tag">' + esc(p.specialty) + "</span>" : "") +
      (p.city ? '<span class="tag">📍 ' + esc(p.city) + "</span>" : "") +
      '<div class="bio">' + esc(p.bio || t("noBio")) + "</div>" +
      (wa ? '<a class="btn wa" target="_blank" rel="noopener" href="' + wa + '">' + esc(t("wa")) + "</a>" : "") +
      '<div class="sub">' + esc(t("listingsOf")) + " (" + mine.length + ")</div>" +
      (mine.length ? mine.map(function (i) { return cardHTML(i, false); }).join("") : '<p class="empty">' + esc(t("none")) + "</p>");
    showView("profile");
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-prof]");
    if (b) openProfile(b.getAttribute("data-prof"));
  });
  $("back-pros").addEventListener("click", function () { showView("pros"); });

  function fillProfileForm() {
    $("pf-spec").innerHTML = '<option value="">' + esc(t("spec0")) + "</option>" +
      CATS.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("");
    var p = currentUser && profiles[currentUser.id];
    if (p) { $("pf-city").value = p.city || ""; $("pf-spec").value = p.specialty || ""; $("pf-bio").value = p.bio || ""; }
  }

  $("form-profile").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!sb || !currentUser) return status(t("relog"), "err");
    var m = currentUser.user_metadata || {}, old = profiles[currentUser.id] || {};
    var row = { id: currentUser.id, full_name: old.full_name || m.full_name || currentUser.email,
                phone: old.phone || m.phone || null, user_type: old.user_type || m.user_type || "client",
                city: $("pf-city").value.trim(), specialty: $("pf-spec").value, bio: $("pf-bio").value.trim() };
    var btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    var r = await sb.from("profiles").upsert([row]);
    btn.disabled = false;
    if (r.error) return status(t("profErr") + r.error.message, "err");
    profiles[currentUser.id] = row;
    status(t("profileSaved"), "ok");
    renderPros(); renderListings();
  });

  /* ================= Photos ================= */
  // Réduit la photo (max 1280 px, JPEG) pour économiser les données mobiles
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1280, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error("Image illisible")); }, "image/jpeg", 0.8);
      };
      img.onerror = function () { reject(new Error("Image illisible")); };
      img.src = url;
    });
  }
  function resetPhoto() {
    $("photo-preview").classList.add("hidden"); $("photo-preview").src = "";
    $("photo-text").textContent = t("addPhoto");
  }
  $("li-photo").addEventListener("change", function () {
    var f = this.files[0];
    if (!f) return resetPhoto();
    $("photo-preview").src = URL.createObjectURL(f);
    $("photo-preview").classList.remove("hidden");
    $("photo-text").textContent = t("changePhoto");
  });

  /* ================= Annonces ================= */
  async function loadListings() {
    if (!sb) { $("listings").innerHTML = '<p class="empty">—</p>'; return; }
    $("listings").innerHTML = '<p class="empty">' + esc(t("loading")) + "</p>";
    var r = await sb.from("listings").select("*").order("created_at", { ascending: false });
    if (r.error) { $("listings").innerHTML = '<p class="empty" style="color:#dc2626">' + esc(t("errAds") + r.error.message) + "</p>"; return; }
    allListings = r.data || [];
    renderListings();
  }

  function waLink(phone) {
    var d = String(phone || "").replace(/\D/g, "");
    if (!d) return "";
    if (d.length === 9) d = "237" + d;       // numéro camerounais sans indicatif
    return "https://wa.me/" + d;
  }

  function cardHTML(i, withDelete) {
    var wa = waLink(i.phone);
    return '<div class="ad">' + (i.image_url ? '<img loading="lazy" alt="" src="' + esc(i.image_url) + '">' : "") + "<h4>" + esc(i.title) + "</h4><div>" + esc(i.description) + "</div>" +
      '<div class="p">' + esc(Number(i.price).toLocaleString("fr-FR")) + " FCFA</div>" +
      '<div class="m">' + esc(i.category || "") + (i.city ? " · " + esc(i.city) : "") + "</div>" +
      (profiles[i.provider_id] ? '<div class="m">' + esc(t("by")) + '<button type="button" class="lnk" data-prof="' + esc(i.provider_id) + '">' + esc(profiles[i.provider_id].full_name || "") + "</button></div>" : "") +
      (wa ? '<a class="btn wa" target="_blank" rel="noopener" href="' + wa + '">' + esc(t("wa")) + "</a>" : "") +
      (withDelete ? '<button type="button" class="btn red sm" style="margin-top:10px" data-del="' + esc(i.id) + '">' + esc(t("del")) + "</button>" : "") +
      "</div>";
  }

  var CATS = ["Gros œuvre", "Plomberie", "Électricité", "Menuiserie", "Carrelage & peinture",
              "Matériaux de construction", "Location d'engins", "Autre"];
  function fillFilters() {
    var cs = $("f-cat"), vs = $("f-city"), cc = cs.value, cv = vs.value;
    var cats = CATS.slice(), cities = [];
    allListings.forEach(function (i) {
      if (i.category && cats.indexOf(i.category) < 0) cats.push(i.category);
      var c = (i.city || "").trim();
      if (c && cities.indexOf(c) < 0) cities.push(c);
    });
    cities.sort();
    cs.innerHTML = '<option value="">' + esc(t("allCats")) + "</option>" +
      cats.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + "</option>"; }).join("");
    vs.innerHTML = '<option value="">' + esc(t("allCities")) + "</option>" +
      cities.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + "</option>"; }).join("");
    cs.value = cc; vs.value = cv;
  }

  function renderListings() {
    fillFilters();
    var q = ($("q").value || "").toLowerCase().trim();
    var fc = $("f-cat").value, fv = $("f-city").value, fm = parseFloat($("f-price").value), so = $("f-sort").value;
    var list = allListings.filter(function (i) {
      if (fc && i.category !== fc) return false;
      if (fv && (i.city || "").trim() !== fv) return false;
      if (!isNaN(fm) && Number(i.price) > fm) return false;
      if (!q) return true;
      return [i.title, i.description, i.category, i.city].join(" ").toLowerCase().indexOf(q) !== -1;
    });
    if (so === "asc") list = list.slice().sort(function (a, b) { return a.price - b.price; });
    if (so === "desc") list = list.slice().sort(function (a, b) { return b.price - a.price; });
    $("count").textContent = list.length + t("nAds");
    $("listings").innerHTML = list.length ? list.map(function (i) { return cardHTML(i, false); }).join("")
                                          : '<p class="empty">' + esc(t("none")) + "</p>";
    var mine = currentUser ? allListings.filter(function (i) { return i.provider_id === currentUser.id; }) : [];
    $("mine").innerHTML = mine.length ? mine.map(function (i) { return cardHTML(i, true); }).join("")
                                      : '<p class="empty">' + esc(t("noneMine")) + "</p>";
  }
  $("q").addEventListener("input", renderListings);
  $("f-price").addEventListener("input", renderListings);
  ["f-cat", "f-city", "f-sort"].forEach(function (id) { $(id).addEventListener("change", renderListings); });
  $("f-reset").addEventListener("click", function () {
    $("q").value = ""; $("f-cat").value = ""; $("f-city").value = ""; $("f-price").value = ""; $("f-sort").value = "recent";
    renderListings();
  });

  $("mine").addEventListener("click", async function (e) {
    var b = e.target.closest("[data-del]");
    if (!b || !confirm(t("confirmDel"))) return;
    var id = b.getAttribute("data-del");
    var item = allListings.filter(function (x) { return String(x.id) === id; })[0];
    var r = await sb.from("listings").delete().eq("id", id);
    if (!r.error && item && item.image_url) {
      var m = item.image_url.split("/listing-images/")[1];
      if (m) sb.storage.from("listing-images").remove([decodeURIComponent(m)]);
    }
    if (r.error) return status("Erreur : " + r.error.message, "err");
    status(t("deleted"), "ok");
    loadListings();
  });

  /* ================= Démarrage ================= */
  async function init() {
    applyLang();
    if (!sb) { status(t("noLib"), "err"); return; }
    status(t("ready"));
    var s = await sb.auth.getSession();
    var session = s.data && s.data.session;
    if (session && session.user) {
      currentUser = session.user;
      $("panel").classList.remove("hidden");
      renderUser();
    } else {
      $("auth").classList.remove("hidden");
    }
    showView("listings");
    await loadProfiles();
    fillProfileForm();
    renderPros();
    loadListings();
  }
  init();
})();
</script>
</body>
</html>
