<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTP-Connect | Cameroun</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans p-4 max-w-md mx-auto">

<header class="bg-white p-4 rounded-xl shadow mb-6 flex justify-between items-center">
  <h1 class="text-lg font-black">BTP-<span class="text-amber-600">Connect</span> 🇨🇲</h1>
  <select id="lang-select" class="text-xs font-bold border p-1 rounded bg-gray-50">
    <option value="fr">🇫🇷 FR</option>
    <option value="en">🇬🇧 EN</option>
  </select>
</header>

<div id="status-box" class="bg-amber-50 border-l-4 border-amber-500 p-3 mb-6 rounded text-xs text-amber-800">
  État : chargement…
</div>

<div id="auth-card" class="bg-white p-6 rounded-2xl shadow space-y-6 mb-6">
  <div class="flex border-b pb-2">
    <button type="button" id="btn-tab-signup" class="flex-1 font-bold text-amber-600 border-b-2 border-amber-600 pb-1">S'inscrire</button>
    <button type="button" id="btn-tab-login" class="flex-1 font-bold text-gray-400 pb-1">Se connecter</button>
  </div>

  <form id="form-signup" class="space-y-3">
    <h2 class="font-bold text-gray-800 text-sm">Créer un compte</h2>
    <input type="text" id="su-name" placeholder="Nom complet" required class="w-full p-2.5 border rounded text-sm">
    <input type="email" id="su-email" placeholder="E-mail" required class="w-full p-2.5 border rounded text-sm">
    <input type="tel" id="su-phone" placeholder="Téléphone / WhatsApp" required class="w-full p-2.5 border rounded text-sm">
    <select id="su-type" class="w-full p-2.5 border rounded text-sm">
      <option value="client">Client / Maître d'ouvrage</option>
      <option value="artisan">Artisan / Mettreur qualifié</option>
      <option value="entreprise">Entreprise BTP / Fournisseur</option>
    </select>
    <input type="password" id="su-pass" placeholder="Mot de passe (6 car. min)" minlength="6" required class="w-full p-2.5 border rounded text-sm">
    <button type="submit" class="w-full bg-amber-600 text-white font-bold p-2.5 rounded text-sm shadow">S'inscrire maintenant</button>
  </form>

  <form id="form-login" class="space-y-3 hidden">
    <h2 class="font-bold text-gray-800 text-sm">Connexion à votre compte</h2>
    <input type="email" id="lo-email" placeholder="E-mail" required class="w-full p-2.5 border rounded text-sm">
    <input type="password" id="lo-pass" placeholder="Mot de passe" required class="w-full p-2.5 border rounded text-sm">
    <button type="submit" class="w-full bg-gray-900 text-white font-bold p-2.5 rounded text-sm shadow">Se connecter</button>
  </form>
</div>

<div id="user-panel" class="bg-white p-6 rounded-2xl shadow space-y-4 mb-6 hidden">
  <p id="user-welcome" class="font-bold text-green-600 text-sm"></p>
  <button type="button" id="btn-logout" class="w-full bg-red-100 text-red-600 font-bold p-2 rounded text-sm">Se déconnecter</button>
</div>

<div class="bg-white p-6 rounded-2xl shadow space-y-3">
  <h2 class="font-bold text-amber-600 text-sm">📢 Annonces BTP Récentes</h2>
  <div id="listings-box" class="text-xs text-gray-600">Chargement des annonces…</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const setStatus = (msg) => { $('status-box').textContent = 'État : ' + msg; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Toute erreur JS s'affiche à l'écran (utile sur téléphone)
window.addEventListener('error', (e) => setStatus('Erreur JS : ' + e.message));
window.addEventListener('unhandledrejection', (e) => setStatus('Erreur : ' + (e.reason?.message || e.reason)));

// IMPORTANT : le client s'appelle "sb" (pas "supabase") pour ne pas entrer en conflit avec la librairie
let sb = null;
try {
  sb = window.supabase.createClient(
    'https://rbquptvfvqykhlekwwgc.supabase.co',
    'sb_publishable_ZyAvi5UYSblQfE8AYghvPQ_o-90ihPa'
  );
  setStatus('Système initialisé.');
} catch (err) {
  setStatus('Supabase non chargé : ' + err.message);
}

function switchTab(tab) {
  const signup = tab === 'signup';
  $('form-signup').classList.toggle('hidden', !signup);
  $('form-login').classList.toggle('hidden', signup);
  $('btn-tab-signup').className = 'flex-1 font-bold pb-1 ' + (signup ? 'text-amber-600 border-b-2 border-amber-600' : 'text-gray-400');
  $('btn-tab-login').className = 'flex-1 font-bold pb-1 ' + (!signup ? 'text-amber-600 border-b-2 border-amber-600' : 'text-gray-400');
}

// Événements attachés en JS (plus fiable que onclick="")
$('btn-tab-signup').addEventListener('click', () => switchTab('signup'));
$('btn-tab-login').addEventListener('click', () => switchTab('login'));
$('btn-logout').addEventListener('click', async () => {
  if (sb) await sb.auth.signOut();
  location.reload();
});
$('lang-select').addEventListener('change', (e) => {
  alert(e.target.value === 'en' ? 'English mode selected.' : 'Mode français sélectionné.');
});

$('form-signup').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!sb) return alert('Connexion au serveur impossible (Supabase non chargé).');
  setStatus("Inscription en cours…");

  const { data, error } = await sb.auth.signUp({
    email: $('su-email').value.trim(),
    password: $('su-pass').value,
    options: { data: {
      full_name: $('su-name').value.trim(),
      phone: $('su-phone').value.trim(),
      user_type: $('su-type').value
    }}
  });
  if (error) { setStatus("Échec de l'inscription."); return alert("Erreur d'inscription : " + error.message); }

  // Profil créé tout de suite seulement s'il y a une session (confirmation e-mail désactivée)
  if (data.session && data.user) {
    const { error: pErr } = await sb.from('profiles').insert([{
      id: data.user.id,
      full_name: $('su-name').value.trim(),
      phone: $('su-phone').value.trim(),
      user_type: $('su-type').value
    }]);
    if (pErr) { setStatus('Compte créé, erreur profil.'); return alert('Compte créé mais erreur profil : ' + pErr.message); }
    setStatus('Compte créé.'); location.reload();
  } else {
    setStatus('Compte créé. Confirmez votre e-mail.');
    alert('Compte créé ! Vérifiez vos e-mails pour confirmer, puis connectez-vous.');
    switchTab('login');
  }
});

$('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!sb) return alert('Connexion au serveur impossible (Supabase non chargé).');
  setStatus('Connexion en cours…');
  const { error } = await sb.auth.signInWithPassword({
    email: $('lo-email').value.trim(),
    password: $('lo-pass').value
  });
  if (error) { setStatus('Échec de la connexion.'); return alert('Erreur de connexion : ' + error.message); }
  location.reload();
});

async function loadListings() {
  const box = $('listings-box');
  if (!sb) { box.textContent = 'Annonces indisponibles.'; return; }
  const { data, error } = await sb.from('listings').select('*').order('created_at', { ascending: false });
  if (error) { box.innerHTML = '<span class="text-red-500">Erreur : ' + esc(error.message) + '</span>'; return; }
  if (!data || !data.length) { box.textContent = 'Aucune annonce pour le moment.'; return; }
  box.innerHTML = data.map(i => `
    <div class="p-2 mb-2 bg-amber-50 border-l-2 border-amber-600 rounded">
      <strong>${esc(i.title)}</strong><br>${esc(i.description)}<br>
      <span class="text-emerald-600 font-bold">${esc(i.price)} FCFA</span>
    </div>`).join('');
}

(async () => {
  loadListings();
  if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    $('auth-card').classList.add('hidden');
    $('user-panel').classList.remove('hidden');
    $('user-welcome').textContent = '✅ Connecté : ' + session.user.email;
    setStatus('Utilisateur connecté.');
  }
})();
</script>
</body>
</html>
